<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="530" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Discharge pulse: gate signals and load current (1 tick = 1 µs)</text>

  <!-- Phase bands (x = 100 + 12 * t) -->
  <rect x="100"   y="36" width="132"   height="419" fill="#f2f2f2"/>
  <rect x="232"   y="36" width="144"   height="419" fill="#e3f4e3"/>
  <rect x="376"   y="36" width="12.7"  height="419" fill="#fff0b8"/>
  <rect x="388.7" y="36" width="311.3" height="419" fill="#e1ecf9"/>
  <rect x="700"   y="36" width="132"   height="419" fill="#f2f2f2"/>

  <!-- Phase labels -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="166"   y="52">CH2 off: I = 0</text>
    <text x="304"   y="52">CH1 + CH2: I rises</text>
    <text x="382.4" y="52" font-size="9">DT</text>
    <text x="544"   y="52">CH1N + CH2: I falls</text>
    <text x="766"   y="52">CH2 off: I = 0</text>
  </g>

  <!-- Vertical guides -->
  <g stroke="#999" stroke-width="1" stroke-dasharray="4 3">
    <line x1="100" y1="36" x2="100" y2="470"/>
    <line x1="232" y1="36" x2="232" y2="470"/>
    <line x1="376" y1="36" x2="376" y2="470"/>
    <line x1="700" y1="36" x2="700" y2="470"/>
    <line x1="808" y1="36" x2="808" y2="470"/>
    <line x1="820" y1="36" x2="820" y2="470"/>
  </g>

  <!-- Lane labels -->
  <g font-size="13" font-weight="bold" text-anchor="end">
    <text x="88" y="108" fill="#1f77b4">CH1</text>
    <text x="88" y="183" fill="#d9640a">CH1N</text>
    <text x="88" y="258" fill="#2ca02c">CH2</text>
    <text x="88" y="385" fill="#d62728">Current</text>
    <text x="88" y="400" fill="#d62728" font-size="10" font-weight="normal">(illustrative)</text>
  </g>

  <!-- Lane baselines -->
  <g stroke="#cccccc" stroke-width="1">
    <line x1="100" y1="125" x2="832" y2="125"/>
    <line x1="100" y1="200" x2="832" y2="200"/>
    <line x1="100" y1="275" x2="832" y2="275"/>
    <line x1="100" y1="440" x2="832" y2="440"/>
  </g>

  <!-- CH1: HIGH from DT (1.06 us) to 23 us -->
  <path d="M100,125 H112.7 V80 H376 V125 H832" fill="none" stroke="#1f77b4" stroke-width="2.5"/>

  <!-- CH1N: LOW from 0 to 24.06 us (23 us + DT), HIGH otherwise -->
  <path d="M88,155 H100 V200 H388.7 V155 H832" fill="none" stroke="#d9640a" stroke-width="2.5"/>

  <!-- CH2: HIGH from 11 us to 50 us (forced LOW by the CC4 ISR) -->
  <path d="M100,275 H232 V230 H700 V275 H832" fill="none" stroke="#2ca02c" stroke-width="2.5"/>

  <!-- Current ramp (illustrative) -->
  <polygon points="232,440 376,330 388.7,330 700,400 700,440" fill="#d62728" fill-opacity="0.15"/>
  <path d="M100,440 H232 L376,330 H388.7 L700,400 V440 H832" fill="none" stroke="#d62728" stroke-width="2.5"/>
  <text x="304" y="372" font-size="11" fill="#b01e1e" text-anchor="middle" transform="rotate(-27 304 372)">rising</text>
  <text x="544" y="352" font-size="11" fill="#b01e1e" text-anchor="middle" transform="rotate(12 544 352)">falling</text>
  <text x="378" y="322" font-size="10" fill="#b01e1e" text-anchor="middle">I peak</text>
  <text x="706" y="418" font-size="10" fill="#b01e1e">CH2 off: I drops to 0</text>

  <!-- Event annotations -->
  <g font-size="10" fill="#444">
    <text x="232" y="86" text-anchor="middle" transform="translate(0,0)">CCR2 = 11</text>
    <text x="376" y="136" text-anchor="middle">CCR1 = 23</text>
    <text x="700" y="224" text-anchor="middle">CC4: ISR forces CH2 LOW</text>
  </g>

  <!-- Dead-time marks -->
  <g font-size="9" fill="#444">
    <text x="106" y="75">DT</text>
    <text x="394" y="150">DT</text>
  </g>

  <!-- Time axis -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="100" y1="470" x2="840" y2="470"/>
    <line x1="100" y1="466" x2="100" y2="474"/>
    <line x1="232" y1="466" x2="232" y2="474"/>
    <line x1="376" y1="466" x2="376" y2="474"/>
    <line x1="700" y1="466" x2="700" y2="474"/>
    <line x1="808" y1="466" x2="808" y2="474"/>
    <line x1="820" y1="466" x2="820" y2="474"/>
  </g>
  <g font-size="11" fill="#222">
    <text x="100" y="488" text-anchor="middle">0</text>
    <text x="232" y="488" text-anchor="middle">11</text>
    <text x="376" y="488" text-anchor="middle">23</text>
    <text x="700" y="488" text-anchor="middle">50</text>
    <text x="806" y="488" text-anchor="end">59 (CC3)</text>
    <text x="822" y="488" text-anchor="start">60 (ARR)</text>
    <text x="890" y="474" text-anchor="end">t (µs)</text>
  </g>

  <!-- Footer note -->
  <text x="100" y="512" font-size="10" fill="#555">DT = dead-time (BDTR DeadTime = 76, about 1.06 µs). Current shape is qualitative: slopes depend on load and supply. Replace with a scope capture if available.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
